<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crabby Beach Run</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a0a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Press Start 2P', monospace;
  }

  #ui {
    color: #ffe84a;
    font-size: 10px;
    display: flex;
    gap: 40px;
    margin-bottom: 12px;
    text-shadow: 2px 2px #000;
  }

  canvas {
    display: block;
    image-rendering: pixelated;
    border: 4px solid #ffe84a;
    box-shadow: 0 0 0 4px #cc3300, 0 0 40px #cc330066;
  }

  #instructions {
    color: #aaa;
    font-size: 7px;
    margin-top: 10px;
    letter-spacing: 1px;
  }

  #overlay {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    pointer-events: none;
  }

  #overlay h1 {
    font-family: 'Press Start 2P', monospace;
    color: #ffe84a;
    font-size: 28px;
    text-shadow: 3px 3px #cc3300, 6px 6px #000;
    letter-spacing: 2px;
  }

  #overlay p {
    font-family: 'Press Start 2P', monospace;
    color: #fff;
    font-size: 10px;
    text-shadow: 2px 2px #000;
    animation: blink 1s step-end infinite;
  }

  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>

<div id="ui">
  <span>SCORE: <span id="scoreDisplay">0</span></span>
  <span>BEST: <span id="bestDisplay">0</span></span>
  <span>LIVES: <span id="livesDisplay">❤️❤️❤️</span></span>
</div>

<div style="position:relative">
  <canvas id="canvas" width="680" height="280"></canvas>
  <div id="overlay">
    <h1 id="overlayTitle">CRABBY BEACH RUN</h1>
    <p id="overlayMsg">PRESS SPACE OR TAP TO START</p>
  </div>
</div>

<div id="instructions">SPACE / TAP = JUMP &nbsp;|&nbsp; DOUBLE JUMP ALLOWED</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const W = 680, H = 280;
const GROUND = H - 52;
const PS = 6; // pixel size

let state = 'title'; // title | playing | dead
let score = 0, best = 0, lives = 3, frame = 0, speed = 3.5;
let jumpCount = 0;

// ── helpers ──────────────────────────────────────────────────────────────────
function px(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x * PS, y * PS, w * PS, h * PS);
}

// ── DRAW CRAB ─────────────────────────────────────────────────────────────────
function drawCrab(cx, cy, squish = 1) {
  // cx,cy = pixel-grid coords of top-left of body
  const b = [
    // body rows [row, col, w, color]
    // shell
    [0,2,4,'#CC3300'],[0,4,4,'#FF4400'],
    [1,1,2,'#CC3300'],[1,3,4,'#FF5500'],[1,7,2,'#CC3300'],
    [2,1,1,'#FF4400'],[2,2,2,'#FF6633'],[2,4,4,'#FF8855'],[2,8,1,'#FF6633'],[2,9,1,'#FF4400'],
    [3,1,1,'#FF4400'],[3,2,1,'#FF6633'],[3,3,1,'#111111'],[3,4,4,'#FF8855'],[3,8,1,'#111111'],[3,9,1,'#FF6633'],[3,10,1,'#FF4400'],
    [4,1,1,'#CC3300'],[4,2,1,'#FF5500'],[4,3,1,'#FF6633'],[4,4,1,'#222222'],[4,5,1,'#FF8855'],[4,6,1,'#222222'],[4,7,1,'#FF8855'],[4,8,1,'#222222'],[4,9,1,'#FF5500'],[4,10,1,'#CC3300'],
    [5,2,1,'#CC3300'],[5,3,2,'#FF5500'],[5,5,4,'#FF6633'],[5,9,1,'#FF5500'],[5,10,1,'#CC3300'],
    [6,3,1,'#AA2200'],[6,4,4,'#CC3300'],[6,8,1,'#AA2200'],
    // eye shine
  ];
  ctx.save();
  ctx.translate(cx * PS, cy * PS);
  ctx.scale(1, squish);
  b.forEach(([r,c,w,col]) => {
    ctx.fillStyle = col;
    ctx.fillRect(c*PS, r*PS, w*PS, PS);
  });
  // eye shines
  ctx.fillStyle='#fff';
  ctx.fillRect(3*PS+2, 3*PS+2, 3, 3);
  ctx.fillRect(8*PS+2, 3*PS+2, 3, 3);

  // claws
  const clawL = [
    [1,0-4,3,'#CC3300'],[2,0-3,4,'#FF4400'],[3,0-3,1,'#CC3300'],[3,0-2,2,'#FF5500'],
    [2,0-5,1,'#AA2200'],[2,0-4,1,'#CC3300'],
    [3,0-5,1,'#331100'],[3,0-4,1,'#551100'],
    [4,0-5,1,'#AA2200'],[4,0-4,1,'#CC3300'],[4,0-3,2,'#FF4400'],[4,0-1,2,'#FF5500'],
  ];
  clawL.forEach(([r,c,w,col]) => {
    ctx.fillStyle=col; ctx.fillRect(c*PS, r*PS, w*PS, PS);
  });
  const clawR = [
    [1,11,3,'#CC3300'],[2,11,3,'#FF4400'],[2,14,1,'#CC3300'],
    [3,11,2,'#FF5500'],[3,13,1,'#FF4400'],[3,14,1,'#CC3300'],
    [2,15,1,'#AA2200'],[3,15,1,'#AA2200'],
    [3,15,1,'#551100'],[3,16,1,'#331100'],
    [4,11,2,'#FF5500'],[4,13,1,'#FF4400'],[4,14,1,'#CC3300'],[4,15,1,'#AA2200'],
  ];
  clawR.forEach(([r,c,w,col]) => {
    ctx.fillStyle=col; ctx.fillRect(c*PS, r*PS, w*PS, PS);
  });

  // legs (animated with frame)
  const legOff = Math.sin(frame * 0.3) * 0.3;
  [[2,7,'#CC3300'],[3,6,'#CC3300'],[4,5,'#AA2200'],
   [2,8,'#CC3300'],[3,9,'#CC3300'],[4,10,'#AA2200'],
  ].forEach(([r,c,col],i) => {
    ctx.fillStyle=col;
    const yo = (i<3 ? legOff : -legOff)*PS;
    ctx.fillRect((c+2)*PS, (6+r)*PS + yo, PS, PS);
  });
  [[2,0,'#CC3300'],[3,1,'#CC3300'],[4,2,'#AA2200'],
   [2,1,'#CC3300'],[3,2,'#CC3300'],[4,3,'#AA2200'],
  ].forEach(([r,c,col],i) => {
    ctx.fillStyle=col;
    const yo = (i<3 ? -legOff : legOff)*PS;
    ctx.fillRect((c)*PS, (6+r)*PS + yo, PS, PS);
  });
  ctx.restore();
}

// ── DRAW CLOUD ────────────────────────────────────────────────────────────────
function drawCloud(x, y, type=0) {
  ctx.save();
  ctx.translate(x, y);
  const P = 4;
  const clouds = [
    // big fluffy
    [
      [0,1,4,'#EEEEEE'],[0,0,1,'#DDDDDD'],[0,5,1,'#EEEEEE'],
      [-1,0,7,'#FFFFFF'],[-1,7,1,'#EEEEEE'],
      [-2,2,4,'#FFFFFF'],[-2,1,1,'#EEEEEE'],[-2,6,1,'#EEEEEE'],
      [1,0,9,'#EEEEEE'],[1,9,1,'#CCCCCC'],
    ],
    // small puffy
    [
      [0,0,5,'#EEEEEE'],
      [-1,0,6,'#FFFFFF'],[-1,6,1,'#DDDDDD'],
      [-2,1,3,'#FFFFFF'],[-2,0,1,'#EEEEEE'],
      [1,0,7,'#DDDDDD'],
    ],
    // storm
    [
      [0,1,4,'#9AABB8'],[0,0,1,'#8899AA'],[0,5,1,'#9AABB8'],
      [-1,0,7,'#AABBCC'],[-1,7,1,'#8899AA'],
      [-2,2,3,'#AABBCC'],[-2,1,1,'#9AABB8'],
      [1,0,8,'#8899AA'],[1,8,1,'#778899'],
    ],
  ];
  const data = clouds[type % clouds.length];
  data.forEach(([r,c,w,col]) => {
    ctx.fillStyle = col;
    ctx.fillRect(c*P, r*P, w*P, P);
  });
  ctx.restore();
}

// ── DRAW SHELL ────────────────────────────────────────────────────────────────
function drawShell(x, y, type=0) {
  ctx.save();
  ctx.translate(x, y);
  const P = 5;
  if (type === 0) {
    // spiral
    const d = [
      [0,1,4,'#D4956A'],[0,0,1,'#C07A50'],
      [1,0,1,'#C07A50'],[1,1,2,'#E8B080'],[1,3,2,'#F0C090'],[1,5,2,'#E8B080'],[1,7,1,'#C07A50'],
      [2,0,1,'#FF4400'],[2,1,1,'#E8B080'],[2,2,2,'#8B4A2A'],[2,4,2,'#F8D8A8'],[2,6,1,'#E8B080'],[2,7,1,'#C07A50'],
      [3,0,1,'#D4956A'],[3,1,1,'#E8B080'],[3,2,1,'#8B4A2A'],[3,3,2,'#F8D8A8'],[3,5,1,'#8B4A2A'],[3,6,1,'#E8B080'],[3,7,1,'#D4956A'],
      [4,0,1,'#C07A50'],[4,1,1,'#E8B080'],[4,2,4,'#F8D8A8'],[4,6,1,'#E8B080'],[4,7,1,'#C07A50'],
      [5,1,1,'#D4956A'],[5,2,4,'#E8B080'],[5,6,1,'#D4956A'],
      [6,2,1,'#C07A50'],[6,3,2,'#D4956A'],[6,5,1,'#C07A50'],
    ];
    d.forEach(([r,c,w,col]) => { ctx.fillStyle=col; ctx.fillRect(c*P,r*P,w*P,P); });
  } else if (type === 1) {
    // conch
    const d = [
      [0,1,2,'#E8907A'],[0,3,1,'#DD7060'],
      [1,0,1,'#E8907A'],[1,1,3,'#F4B090'],[1,4,1,'#DD7060'],
      [2,0,1,'#DD7060'],[2,1,1,'#F4B090'],[2,2,2,'#FFCAAA'],[2,4,1,'#F4B090'],[2,5,1,'#DD7060'],
      [3,0,1,'#E8907A'],[3,1,4,'#FFCAAA'],[3,5,1,'#E8907A'],
      [4,0,1,'#DD7060'],[4,1,1,'#F4B090'],[4,2,2,'#FF9977'],[4,4,1,'#F4B090'],[4,5,1,'#DD7060'],
      [5,0,1,'#E8907A'],[5,1,3,'#F4B090'],[5,4,1,'#E8907A'],
      [5,5,1,'#DD7060'],[4,6,1,'#E8907A'],[3,6,1,'#DD7060'],
      [6,1,1,'#FF9977'],[6,2,1,'#FFCAAA'],[6,3,1,'#F4B090'],
    ];
    d.forEach(([r,c,w,col]) => { ctx.fillStyle=col; ctx.fillRect(c*P,r*P,w*P,P); });
  } else {
    // scallop
    const d = [
      [0,1,3,'#C8A8D8'],
      [1,0,1,'#D8B8E8'],[1,1,2,'#E8CCF4'],[1,3,1,'#B890C8'],[1,4,2,'#E8CCF4'],[1,6,1,'#D8B8E8'],
      [2,0,1,'#B890C8'],[2,1,1,'#D8B8E8'],[2,2,1,'#F0DCFF'],[2,3,1,'#B890C8'],[2,4,1,'#F0DCFF'],[2,5,1,'#D8B8E8'],[2,6,1,'#B890C8'],
      [3,0,1,'#C8A8D8'],[3,1,2,'#E8CCF4'],[3,3,1,'#F0DCFF'],[3,4,2,'#E8CCF4'],[3,6,1,'#C8A8D8'],
      [4,1,1,'#B890C8'],[4,2,1,'#C8A8D8'],[4,3,1,'#D8B8E8'],[4,4,1,'#C8A8D8'],[4,5,1,'#B890C8'],
      [5,2,2,'#9870B0'],[5,4,1,'#9870B0'],
      [6,3,1,'#7A5590'],
    ];
    d.forEach(([r,c,w,col]) => { ctx.fillStyle=col; ctx.fillRect(c*P,r*P,w*P,P); });
  }
  ctx.restore();
}

// ── GAME STATE ────────────────────────────────────────────────────────────────
let crab = { x: 80, y: GROUND - 42, vy: 0, w: 18*PS, h: 7*PS, grounded: true, squish: 1 };

let clouds = [
  { x: 100, y: 30, type: 0, spd: 0.4 },
  { x: 350, y: 15, type: 1, spd: 0.6 },
  { x: 550, y: 50, type: 2, spd: 0.5 },
  { x: 750, y: 25, type: 0, spd: 0.3 },
];

let obstacles = [];
let obstTimer = 0;
let bgOffset = 0;
let invincible = 0;

function spawnObstacle() {
  const type = Math.random() < 0.5 ? 0 : (Math.random() < 0.5 ? 1 : 2);
  obstacles.push({ x: W + 20, type, w: 40, h: 42 });
}

function resetGame() {
  crab.y = GROUND - 42;
  crab.vy = 0;
  crab.grounded = true;
  crab.squish = 1;
  obstacles = [];
  obstTimer = 80;
  score = 0;
  lives = 3;
  speed = 3.5;
  frame = 0;
  jumpCount = 0;
  invincible = 0;
  updateUI();
}

function jump() {
  if (state === 'title' || state === 'dead') {
    resetGame();
    state = 'playing';
    document.getElementById('overlay').style.display = 'none';
    return;
  }
  if (jumpCount < 2) {
    crab.vy = jumpCount === 0 ? -9 : -7;
    crab.grounded = false;
    jumpCount++;
    crab.squish = 0.7;
  }
}

document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); jump(); } });
canvas.addEventListener('click', jump);
canvas.addEventListener('touchstart', e => { e.preventDefault(); jump(); });

function updateUI() {
  document.getElementById('scoreDisplay').textContent = score;
  document.getElementById('bestDisplay').textContent = best;
  const hearts = ['','❤️','❤️❤️','❤️❤️❤️'];
  document.getElementById('livesDisplay').textContent = hearts[Math.max(0,lives)] || '';
}

// ── DRAW GROUND ───────────────────────────────────────────────────────────────
function drawBackground() {
  // sky gradient bands
  ctx.fillStyle = '#87CEEB'; ctx.fillRect(0, 0, W, H * 0.55);
  ctx.fillStyle = '#B0E2FF'; ctx.fillRect(0, H * 0.55, W, H * 0.15);
  // sea
  ctx.fillStyle = '#3A9AD9'; ctx.fillRect(0, H * 0.7, W, H * 0.08);
  ctx.fillStyle = '#2980B9'; ctx.fillRect(0, H * 0.78, W, H * 0.04);
  // sand
  ctx.fillStyle = '#F4D97A'; ctx.fillRect(0, H - 52, W, 52);
  ctx.fillStyle = '#E8C960'; ctx.fillRect(0, H - 52, W, 8);

  // scrolling sand texture
  for (let i = 0; i < 20; i++) {
    const tx = ((i * 70 - bgOffset * 0.5) % (W + 70) + W) % (W + 70) - 20;
    ctx.fillStyle = '#DDB950';
    ctx.fillRect(tx, H - 44, 14, 4);
    ctx.fillRect(tx + 30, H - 34, 8, 3);
  }
}

// ── MAIN LOOP ─────────────────────────────────────────────────────────────────
function gameLoop() {
  ctx.clearRect(0, 0, W, H);
  drawBackground();

  // clouds
  clouds.forEach(c => {
    if (state === 'playing') c.x -= c.spd;
    if (c.x < -200) c.x = W + 50;
    drawCloud(c.x, c.y, c.type);
  });

  if (state === 'playing') {
    frame++;
    bgOffset += speed;
    score++;
    if (score > best) best = score;
    if (score % 500 === 0) speed = Math.min(speed + 0.3, 9);

    // crab physics
    crab.vy += 0.5;
    crab.y += crab.vy;
    if (crab.squish < 1) crab.squish = Math.min(1, crab.squish + 0.05);
    if (crab.y >= GROUND - 42) {
      crab.y = GROUND - 42;
      crab.vy = 0;
      crab.grounded = true;
      jumpCount = 0;
    }

    // spawn obstacles
    obstTimer--;
    if (obstTimer <= 0) {
      spawnObstacle();
      obstTimer = Math.max(50, 120 - score / 100);
    }

    // update obstacles
    obstacles.forEach(o => o.x -= speed);
    obstacles = obstacles.filter(o => o.x > -80);

    // collision
    if (invincible > 0) invincible--;
    obstacles.forEach(o => {
      const cx = crab.x + 10, cy = crab.y + 4, cw = crab.w - 20, ch = crab.h - 8;
      const ox = o.x + 4, ow = o.w - 8;
      if (invincible === 0 && cx < ox + ow && cx + cw > ox && cy < GROUND - 2 && cy + ch > GROUND - o.h) {
        lives--;
        invincible = 90;
        updateUI();
        if (lives <= 0) {
          state = 'dead';
          document.getElementById('overlayTitle').textContent = 'GAME OVER';
          document.getElementById('overlayMsg').textContent = 'PRESS SPACE TO RETRY';
          document.getElementById('overlay').style.display = 'flex';
        }
      }
    });

    updateUI();
  }

  // draw obstacles (shells)
  obstacles.forEach((o, i) => {
    drawShell(o.x, GROUND - o.h, i % 3);
  });

  // draw crab (flicker when invincible)
  if (invincible === 0 || Math.floor(invincible / 5) % 2 === 0) {
    const gridX = Math.round(crab.x / PS);
    const gridY = Math.round(crab.y / PS);
    drawCrab(gridX, gridY, crab.squish);
  }

  // score ticker on canvas
  ctx.fillStyle = '#ffe84a';
  ctx.font = '8px "Press Start 2P", monospace';
  if (state === 'playing') {
    ctx.fillText('x' + Math.floor(score/10), W - 60, 20);
  }

  requestAnimationFrame(gameLoop);
}

// init overlay
document.getElementById('overlay').style.display = 'flex';
document.getElementById('overlay').style.flexDirection = 'column';
document.getElementById('overlay').style.alignItems = 'center';
document.getElementById('overlay').style.justifyContent = 'center';
document.getElementById('overlay').style.gap = '16px';
document.getElementById('overlay').style.width = '100%';
document.getElementById('overlay').style.height = '100%';
document.getElementById('overlay').style.top = '0';
document.getElementById('overlay').style.left = '0';
document.getElementById('overlay').style.position = 'absolute';

gameLoop();
</script>
</body>
</html>
